<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>what is real. — a rhythm game</title>
<meta name="description" content="A rhythm game where every track is mine. Charts that listen to the music.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 16h-8v13H11V16H3z' fill='%23ff3d7f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --hue: 320; --fg:#f4f0ff; --mut:#a59cc4; --line:rgba(255,255,255,0.1); --pink:#ff3d7f; --cyan:#3db8ff; --gold:#ffd23d; --mint:#7dffb0; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; color:var(--fg); font:15px/1.5 'Space Grotesk', system-ui, sans-serif; background:#07040f; }
  body::before { content:''; position:fixed; inset:-20%; z-index:-1; pointer-events:none;
    background:
      radial-gradient(40% 35% at 25% 30%, hsla(var(--hue), 90%, 55%, 0.32), transparent 70%),
      radial-gradient(35% 40% at 75% 65%, hsla(calc(var(--hue) + 70), 90%, 55%, 0.26), transparent 70%),
      radial-gradient(30% 30% at 60% 15%, hsla(calc(var(--hue) + 180), 90%, 60%, 0.16), transparent 70%);
    filter: blur(20px); animation: drift 22s ease-in-out infinite alternate; transition: background 0.6s; }
  body[data-screen=play]::before { display:none; }
  @keyframes drift { from { transform: translate(-3%, -2%) rotate(0deg) scale(1); } to { transform: translate(3%, 2%) rotate(8deg) scale(1.08); } }
  #app { min-height:100vh; }
  h1,h2,h3 { margin:0; letter-spacing:-0.02em; }
  .dot { color:var(--pink); }
  button { font:inherit; color:#0b0618; background:linear-gradient(135deg, var(--mint), #b6ffd6); border:0; border-radius:12px; padding:10px 18px; cursor:pointer; font-weight:700; transition: transform .12s, box-shadow .2s, filter .2s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -8px hsla(var(--hue), 90%, 60%, .6); }
  button:active { transform: translateY(1px) scale(.98); }
  button.ghost, .ghost { background:rgba(255,255,255,0.06); color:var(--fg); border:1px solid var(--line); font-weight:600; }
  button:focus-visible, input:focus-visible, label:focus-within { outline:2px solid var(--cyan); outline-offset:2px; }
  input { font:inherit; background:rgba(0,0,0,0.35); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:11px 14px; width:100%; margin-top:6px; }
  .glass { background:rgba(20,12,40,0.55); border:1px solid var(--line); border-radius:20px; backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 30px 80px -40px rgba(0,0,0,.8); }
  .card { max-width:480px; margin:10vh auto; padding:28px; }
  .row { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .muted,.meta { color:var(--mut); } .error { color:#ff6b8b; min-height:1.4em; margin:6px 0 0; }
  kbd { display:inline-block; min-width:1.6em; text-align:center; background:rgba(255,255,255,.08); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 6px; margin:0 1px; font-size:12px; }

  .hero { min-height:100vh; display:grid; place-content:center; justify-items:center; text-align:center; padding:40px 20px; gap:14px; }
  .logo { display:flex; gap:10px; font-size:38px; font-weight:700; }
  .logo span { width:58px; height:58px; display:grid; place-items:center; border-radius:16px; background:rgba(255,255,255,.06); border:1px solid var(--line); animation: bop 0.5s cubic-bezier(.3,1.8,.6,1) infinite alternate; }
  .logo span:nth-child(1) { color:var(--pink); animation-delay:0s } .logo span:nth-child(2) { color:var(--cyan); animation-delay:.125s }
  .logo span:nth-child(3) { color:var(--gold); animation-delay:.25s } .logo span:nth-child(4) { color:var(--mint); animation-delay:.375s }
  @keyframes bop { from { transform: translateY(0) scale(1); } to { transform: translateY(-10px) scale(1.06); } }
  .title { font-size:clamp(44px, 9vw, 92px); font-weight:700; line-height:1; background:linear-gradient(120deg, #fff, hsl(var(--hue),100%,80%), #fff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lede { max-width:560px; color:var(--mut); font-size:17px; }
  .hero form { margin:12px 0 0; width:min(420px, 92vw); text-align:left; }
  .hero label { display:block; margin:12px 0; color:var(--mut); font-size:13px; }

  .top { display:flex; justify-content:space-between; align-items:center; padding:18px 28px; gap:12px; flex-wrap:wrap; }
  .brand { font-size:24px; } .who { color:var(--fg); font-weight:600; }
  .top nav { display:flex; gap:10px; align-items:center; color:var(--mut); flex-wrap:wrap; }
  .speed { display:flex; align-items:center; gap:8px; font-size:13px; } .speed input { width:90px; margin:0; padding:0; accent-color: hsl(var(--hue),90%,65%); }
  .upload { cursor:pointer; border-radius:12px; padding:10px 16px; font-weight:600; }
  .select { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr); gap:28px; padding:0 28px 28px; }
  @media (max-width:860px) { .select { grid-template-columns:1fr; } }
  .album h2 { font-size:28px; margin:22px 0 10px; display:flex; align-items:baseline; gap:12px; }
  .album h2 small { font-size:13px; color:var(--mut); font-weight:500; letter-spacing:0; }
  .songs ul { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }
  .song { width:100%; display:grid; grid-template-columns:44px 1fr auto; grid-template-rows:auto auto; column-gap:12px; text-align:left; color:var(--fg); font-weight:600; padding:12px; border-radius:16px;
    background:linear-gradient(135deg, hsla(var(--h), 70%, 30%, .35), rgba(255,255,255,.03)); border:1px solid var(--line); }
  .song:hover { border-color: hsla(var(--h), 90%, 70%, .6); box-shadow: 0 10px 30px -14px hsla(var(--h), 90%, 60%, .9); }
  .song.on { border-color: hsl(var(--h), 95%, 70%); box-shadow: 0 0 0 1px hsl(var(--h), 95%, 70%) inset, 0 12px 34px -14px hsla(var(--h), 90%, 60%, 1); }
  .swatch { grid-row:1 / span 2; width:44px; height:44px; border-radius:12px; background: conic-gradient(from 210deg, hsl(var(--h),95%,65%), hsl(calc(var(--h) + 60),95%,60%), hsl(calc(var(--h) + 140),90%,55%), hsl(var(--h),95%,65%)); }
  .song.on .swatch { animation: spin 3s linear infinite; }
  .song .t { align-self:end; } .song .m { color:var(--mut); font-size:12px; font-weight:500; grid-column:2; }
  .song .g { grid-row:1 / span 2; grid-column:3; align-self:center; font-size:18px; font-weight:700; }
  .detail { position:sticky; top:16px; align-self:start; padding:24px; margin-top:22px; overflow:hidden; }
  .cover { height:150px; margin:-24px -24px 18px; display:grid; place-items:center; background: linear-gradient(160deg, hsla(var(--h), 90%, 50%, .55), hsla(calc(var(--h) + 90), 90%, 40%, .35)); }
  .disc { width:110px; height:110px; border-radius:50%; background: radial-gradient(circle, #0b0618 9%, transparent 10%), repeating-radial-gradient(circle, rgba(0,0,0,.55) 0 2px, rgba(0,0,0,.35) 2px 4px), conic-gradient(hsl(var(--h),95%,65%), hsl(calc(var(--h) + 120),95%,60%), hsl(var(--h),95%,65%)); animation: spin 4s linear infinite; box-shadow: 0 14px 40px -10px rgba(0,0,0,.8); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .detail h2 { font-size:28px; }
  .diffs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:18px 0; }
  .diffs button { background:rgba(0,0,0,.3); color:var(--fg); border:1px solid var(--line); text-transform:capitalize; display:flex; flex-direction:column; padding:10px; }
  .diffs button.on { border-color: hsl(var(--hue), 95%, 70%); background: hsla(var(--hue), 90%, 55%, .18); }
  .diffs small { color:var(--mut); font-weight:500; font-size:11px; text-transform:none; }
  .play { width:100%; padding:16px; font-size:20px; letter-spacing:.04em; text-transform:uppercase; background:linear-gradient(135deg, hsl(var(--hue),95%,62%), hsl(calc(var(--hue) + 50),95%,62%)); color:#0b0618; }
  .keys { color:var(--mut); font-size:13px; text-align:center; }
  .detail h3 { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--mut); margin:18px 0 8px; }
  .board { list-style:none; margin:0; padding:0; counter-reset:r; }
  .board li { display:grid; grid-template-columns:28px 1fr 36px 90px; padding:7px 0; border-bottom:1px solid var(--line); counter-increment:r; }
  .board li::before { content:counter(r); color:var(--mut); } .board li.muted::before { content:''; }
  .board li.me { color:var(--mint); } .board li span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .g-SS { color:var(--gold); text-shadow:0 0 18px rgba(255,210,61,.6); } .g-S { color:var(--gold); } .g-A { color:var(--mint); } .g-B { color:var(--cyan); } .g-C, .g-D { color:var(--mut); }
  .recent { padding:0 28px 48px; } .recent h2 { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--mut); margin-bottom:8px; }
  .recent ol { list-style:none; padding:0; margin:0; display:grid; gap:2px; }
  .recent li { display:grid; grid-template-columns:2fr 80px 40px 70px 1.4fr; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .recent time { color:var(--mut); font-size:13px; text-align:right; }
  .tag { display:inline-block; padding:2px 10px; border-radius:999px; background:hsla(var(--hue),90%,60%,.18); border:1px solid hsla(var(--hue),90%,70%,.4); color:var(--fg); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }

  .stage { display:block; width:100vw; height:100vh; touch-action:none; cursor:none; }
  .loading { display:grid; place-items:center; align-content:center; gap:16px; height:100vh; color:var(--mut); }
  .spinner { width:46px; height:46px; border-radius:50%; border:3px solid rgba(255,255,255,.12); border-top-color: hsl(var(--hue),95%,65%); animation: spin .8s linear infinite; }

  .results { max-width:620px; margin:6vh auto; padding:30px; text-align:center; }
  .kicker { color:var(--mut); text-transform:uppercase; letter-spacing:.14em; font-size:12px; margin:0; }
  .grade { font-size:140px; font-weight:700; line-height:1; margin:6px 0 0; animation: slam .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes slam { from { transform: scale(2.6) rotate(-8deg); opacity:0; filter: blur(8px); } to { transform: none; opacity:1; filter:none; } }
  .score { font-size:38px; font-weight:700; margin:0; font-variant-numeric:tabular-nums; display:flex; flex-direction:column; }
  .score small { font-size:15px; color:var(--mut); font-weight:500; }
  .failed { color:#ff6b8b; } .pb { color:var(--gold); }
  .counts { list-style:none; padding:0; margin:18px 0; display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; }
  .counts li { display:flex; flex-direction:column; padding:10px 6px; border-radius:14px; background:rgba(0,0,0,.28); border:1px solid var(--line); text-transform:capitalize; font-size:12px; color:var(--mut); }
  .counts b { font-size:22px; color:var(--fg); }
  .counts .perfect b { color:var(--mint); } .counts .great b { color:var(--cyan); } .counts .good b { color:#ffb84f; } .counts .miss b { color:#ff4f6d; }
  @media (max-width:560px) { .counts { grid-template-columns:repeat(3,1fr); } }
  .timing { margin:6px 0; } .timing canvas { width:100%; height:auto; border-radius:12px; } .timing figcaption { color:var(--mut); font-size:13px; margin-top:6px; }
  .results .row { justify-content:center; }
  .cal { text-align:center; } .beatdot { width:70px; height:70px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff, hsl(var(--hue),95%,62%)); margin:30px auto; box-shadow:0 0 40px hsla(var(--hue),95%,62%,.7); }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; } }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
